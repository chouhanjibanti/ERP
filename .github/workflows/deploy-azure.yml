name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove dotenv files from build workspace
        run: find . -type f \( -name '.env' -o -name '.env.*' \) ! -name '.env.example' -not -path './.git/*' -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-package"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.env' --exclude='.env.*' --exclude='node_modules' --exclude='.next' ./ "$RUNNER_TEMP/deploy-package/"
          cp -a .next node_modules "$RUNNER_TEMP/deploy-package/"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/deploy-package
